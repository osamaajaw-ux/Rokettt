<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ebic Gift - Rocket</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding-bottom: 70px; }
        
        .top-header { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; }
        .back-btn { background: #1e1e1e; border: 1px solid #333; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; color: #fff; cursor: pointer; display: flex; align-items: center; gap: 4px; }
        .gift-badge { background: #1e1e1e; border: 1px solid #333; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; color: #b388ff; }
        .balance-container { display: flex; align-items: center; gap: 6px; background: #1e1e1e; padding: 6px 12px; border-radius: 20px; border: 1px solid #333; }
        .balance-value { font-weight: bold; font-size: 14px; color: #fff; }
        .add-btn { background: #333; border: none; color: #fff; width: 20px; height: 20px; border-radius: 50%; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .history-bar { width: 100%; max-width: 480px; display: flex; gap: 6px; overflow-x: auto; padding: 4px 16px; margin-bottom: 10px; scrollbar-width: none; direction: ltr; }
        .history-bar::-webkit-scrollbar { display: none; }
        .hist-pill { padding: 5px 12px; border-radius: 10px; font-size: 12px; font-weight: bold; white-space: nowrap; }
        .h-green { background: #14532d; color: #4ade80; border: 1px solid #166534; }
        .h-purple { background: #581c87; color: #c084fc; border: 1px solid #6b21a8; }
        .h-gold { background: #78350f; color: #f59e0b; border: 1px solid #b45309; }

        .game-card { width: calc(100% - 32px); max-width: 448px; background: #18181b; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; align-items: center; position: relative; border: 1px solid #27272a; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .rocket-stage { height: 130px; display: flex; justify-content: center; align-items: center; position: relative; width: 100%; }
        .rocket-icon { font-size: 55px; animation: floatAnim 2s ease-in-out infinite; }
        @keyframes floatAnim {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(1deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .multiplier-text { font-size: 38px; font-weight: 800; margin: 5px 0 15px 0; color: #38bdf8; letter-spacing: 0.5px; }

        .action-btn { width: 100%; padding: 14px; border: none; border-radius: 14px; font-size: 16px; font-weight: bold; cursor: pointer; text-align: center; transition: 0.2s; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; }
        .action-btn.cancel { background: #dc2626; }
        .action-btn.cashout { background: #16a34a; }
        .action-btn.disabled { background: #3f3f46; color: #a1a1aa; cursor: not-allowed; }

        .players-section { width: calc(100% - 32px); max-width: 448px; margin-top: 15px; display: flex; flex-direction: column; gap: 8px; min-height: 50px; }
        .player-card { background: #0f291e; border: 1px solid #14532d; border-radius: 14px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
        .player-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; background: #3f3f46; }
        .player-name { font-size: 13px; font-weight: 600; color: #f4f4f5; }
        .player-sub { font-size: 11px; color: #4ade80; margin-top: 2px; display: flex; align-items: center; gap: 4px; }
        .player-right { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: bold; color: #4ade80; background: #14532d; padding: 6px 12px; border-radius: 10px; border: 1px solid #166534; }
        .no-players { font-size: 12px; color: #71717a; text-align: center; padding: 10px; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #18181b; border-top: 1px solid #27272a; display: flex; justify-content: space-around; padding: 8px 0 16px 0; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #71717a; font-size: 10px; cursor: pointer; text-decoration: none; }
        .nav-item.active { color: #a855f7; }
        .nav-icon { font-size: 18px; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: flex-end; z-index: 200; display: none; }
        .modal-content { background: #18181b; width: 100%; max-width: 480px; border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 20px; border-top: 1px solid #27272a; display: flex; flex-direction: column; gap: 14px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 16px; }
        .close-modal { background: none; border: none; color: #a1a1aa; font-size: 18px; cursor: pointer; }
        
        .custom-input { width: 100%; background: #27272a; border: 1px solid #3f3f46; border-radius: 12px; padding: 12px; font-size: 16px; color: #fff; outline: none; }
        .toggle-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #d4d4d8; }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #3f3f46; transition: .3s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #2563eb; }
        input:checked + .slider:before { transform: translateX(20px); }
    </style>
</head>
<body>

    <div class="top-header">
        <button class="back-btn">‹ رجوع</button>
        <div class="gift-badge">🎁 Epic Gift</div>
        <div class="balance-container">
            <span style="font-size: 12px; font-weight: bold; color: #38bdf8;">TON</span>
            <span class="balance-value" id="userBalance">2.00</span>
            <button class="add-btn">+</button>
        </div>
    </div>

    <div class="history-bar" id="historyBar">
        <div class="hist-pill h-green">1.67x</div>
        <div class="hist-pill h-green">1.48x</div>
        <div class="hist-pill h-purple">8.51x</div>
        <div class="hist-pill h-purple">3.59x</div>
        <div class="hist-pill h-green">1.25x</div>
    </div>

    <div class="game-card">
        <div class="rocket-stage">
            <div class="rocket-icon" id="rocketEmoji">🚀</div>
        </div>
        <div class="multiplier-text" id="multiplierDisplay">1.00x</div>
        <button class="action-btn" id="mainBtn" onclick="openBetModal()">Place bet</button>
    </div>

    <!-- قائمة الأشخاص (تظهر فقط رهاناتك الحقيقية ولا توجد أسماء وهمية) -->
    <div class="players-section" id="playersSection">
        <div class="no-players">لا توجد رهانات نشطة في هذه الجولة</div>
    </div>

    <!-- نافذة الرهان -->
    <div class="modal-overlay" id="betModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>Place bet</span>
                <button class="close-modal" onclick="closeBetModal()">✕</button>
            </div>
            
            <div style="display: flex; justify-content: space-between; font-size: 12px; color: #a1a1aa;">
                <span>Available balance</span>
                <span>TON <span id="modalBalance">2.00</span></span>
            </div>

            <div>
                <label style="font-size: 12px; color: #a1a1aa; display: block; margin-bottom: 4px;">مبلغ الرهان (TON):</label>
                <input type="number" id="customBetInput" class="custom-input" value="1.00" step="0.1" min="0.1">
            </div>

            <div class="toggle-row">
                <span>السحب التلقائي (Auto Cashout)</span>
                <label class="switch">
                    <input type="checkbox" id="autoCashoutSwitch" onchange="toggleAutoInput()">
                    <span class="slider"></span>
                </label>
            </div>

            <div id="autoTargetContainer" style="display: none;">
                <label style="font-size: 12px; color: #a1a1aa; display: block; margin-bottom: 4px;">اسحب تلقائياً عند المضاعف:</label>
                <input type="number" id="autoTargetInput" class="custom-input" value="2.00" step="0.1" min="1.1">
            </div>

            <button class="action-btn" onclick="confirmBet()">Place TON Bet</button>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item"><span class="nav-icon">🎒</span>Backpack</div>
        <div class="nav-item"><span class="nav-icon">🎁</span>Invite</div>
        <div class="nav-item active"><span class="nav-icon">🏠</span>Home</div>
        <div class="nav-item"><span class="nav-icon">🏆</span>Leaderboard</div>
        <div class="nav-item"><span class="nav-icon">🪙</span>Earn</div>
    </div>

    <script>
        let balance = localStorage.getItem('leader_bot_balance') ? parseFloat(localStorage.getItem('leader_bot_balance')) : 2.00;
        let currentBetAmount = 0;
        let isBetPlaced = false;
        let hasCashedOut = false;
        let recordedCrash = false;
        let currentWinnings = 0;
        let cashoutMultiplier = 0;

        updateBalanceUI();

        function updateBalanceUI() {
            document.getElementById('userBalance').innerText = balance.toFixed(2);
            document.getElementById('modalBalance').innerText = balance.toFixed(2);
            localStorage.setItem('leader_bot_balance', balance);
        }

        function toggleAutoInput() {
            let isChecked = document.getElementById('autoCashoutSwitch').checked;
            document.getElementById('autoTargetContainer').style.display = isChecked ? 'block' : 'none';
        }

        function openBetModal() {
            let now = Date.now();
            let cycleTime = now % 14000;
            if (cycleTime > 4000) return;
            document.getElementById('betModal').style.display = 'flex';
        }

        function closeBetModal() {
            document.getElementById('betModal').style.display = 'none';
        }

        function confirmBet() {
            let inputVal = parseFloat(document.getElementById('customBetInput').value);
            if (isNaN(inputVal) || inputVal <= 0) {
                alert('الرجاء إدخال مبلغ صحيح للرهان.');
                return;
            }
            if (balance < inputVal) {
                alert('رصيدك غير كافٍ لهذا الرهان!');
                return;
            }

            currentBetAmount = inputVal;
            balance -= currentBetAmount;
            updateBalanceUI();
            isBetPlaced = true;
            hasCashedOut = false;
            closeBetModal();

            updatePlayersUI('waiting');

            let btn = document.getElementById('mainBtn');
            btn.innerText = 'Cancel Bet';
            btn.className = 'action-btn cancel';
            btn.onclick = cancelBet;
        }

        function cancelBet() {
            let now = Date.now();
            let cycleTime = now % 14000;
            if (cycleTime > 4000) return;

            balance += currentBetAmount;
            updateBalanceUI();
            isBetPlaced = false;
            currentBetAmount = 0;
            updatePlayersUI('empty');

            let btn = document.getElementById('mainBtn');
            btn.innerText = 'Place bet';
            btn.className = 'action-btn';
            btn.onclick = openBetModal;
        }

        function cashOut() {
            if (!isBetPlaced || hasCashedOut) return;
            hasCashedOut = true;
            cashoutMultiplier = parseFloat(document.getElementById('multiplierDisplay').innerText);
            currentWinnings = currentBetAmount * cashoutMultiplier;
            balance += currentWinnings;
            updateBalanceUI();
            
            updatePlayersUI('cashed');

            let btn = document.getElementById('mainBtn');
            btn.innerText = 'تم السحب بنجاح ✅';
            btn.className = 'action-btn disabled';
            btn.onclick = null;
        }

        function updatePlayersUI(status) {
            let container = document.getElementById('playersSection');
            if (!isBetPlaced) {
                container.innerHTML = `<div class="no-players">لا توجد رهانات نشطة في هذه الجولة</div>`;
                return;
            }

            if (status === 'waiting') {
                container.innerHTML = `
                    <div class="player-card">
                        <div class="player-info">
                            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" class="avatar" alt="Leader">
                            <div>
                                <div class="player-name">- Leader</div>
                                <div class="player-sub">TON ${currentBetAmount.toFixed(2)} <span style="color: #38bdf8;">بانتظار الانطلاق...</span></div>
                            </div>
                        </div>
                        <div class="player-right" style="background: #1e1e1e; color: #a1a1aa; border: 1px solid #333;">قيد الانتظار</div>
                    </div>`;
            } else if (status === 'playing') {
                container.innerHTML = `
                    <div class="player-card">
                        <div class="player-info">
                            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" class="avatar" alt="Leader">
                            <div>
                                <div class="player-name">- Leader</div>
                                <div class="player-sub">TON ${currentBetAmount.toFixed(2)}</div>
                            </div>
                        </div>
                        <div class="player-right">نشط 🚀</div>
                    </div>`;
            } else if (status === 'cashed') {
                container.innerHTML = `
                    <div class="player-card">
                        <div class="player-info">
                            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" class="avatar" alt="Leader">
                            <div>
                                <div class="player-name">- Leader</div>
                                <div class="player-sub">TON ${currentBetAmount.toFixed(2)} <span style="color: #38bdf8;">×${cashoutMultiplier.toFixed(2)}</span></div>
                            </div>
                        </div>
                        <div class="player-right">TON ${currentWinnings.toFixed(2)}</div>
                    </div>`;
            }
        }

        function addNewHistory(multiplier) {
            let historyBar = document.getElementById('historyBar');
            let newPill = document.createElement('div');
            
            let colorClass = 'h-green';
            if (multiplier >= 2.0 && multiplier < 5.0) colorClass = 'h-purple';
            else if (multiplier >= 5.0) colorClass = 'h-gold';
            
            newPill.className = `hist-pill ${colorClass}`;
            newPill.innerText = multiplier.toFixed(2) + 'x';
            
            historyBar.prepend(newPill);
            if (historyBar.children.length > 8) {
                historyBar.removeChild(historyBar.lastChild);
            }
        }

        setInterval(() => {
            let now = Date.now();
            let cycleTime = now % 14000;

            if (cycleTime < 4000) {
                let countdown = Math.ceil((4000 - cycleTime) / 1000);
                document.getElementById('multiplierDisplay').innerText = `يبدأ خلال ${countdown}s`;
                document.getElementById('rocketEmoji').innerText = '🚀';
                document.getElementById('rocketEmoji').style.filter = 'none';
                recordedCrash = false;

                if (!isBetPlaced) {
                    let btn = document.getElementById('mainBtn');
                    btn.innerText = 'Place bet';
                    btn.className = 'action-btn';
                    btn.onclick = openBetModal;
                    updatePlayersUI('empty');
                } else {
                    updatePlayersUI('waiting');
                }
            } else {
                let elapsedSeconds = (cycleTime - 4000) / 1000;
                let multiplier = 1.00 + (elapsedSeconds * elapsedSeconds * 0.4);

                document.getElementById('multiplierDisplay').innerText = multiplier.toFixed(2) + 'x';

                if (isBetPlaced && !hasCashedOut) {
                    updatePlayersUI('playing');
                    let btn = document.getElementById('mainBtn');
                    btn.innerText = 'Cash Out';
                    btn.className = 'action-btn cashout';
                    btn.onclick = cashOut;

                    let autoEnabled = document.getElementById('autoCashoutSwitch').checked;
                    if (autoEnabled) {
                        let targetMultiplier = parseFloat(document.getElementById('autoTargetInput').value);
                        if (!isNaN(targetMultiplier) && multiplier >= targetMultiplier) {
                            cashOut();
                        }
                    }
                } else if (!isBetPlaced) {
                    let btn = document.getElementById('mainBtn');
                    btn.innerText = 'Started...';
                    btn.className = 'action-btn disabled';
                    btn.onclick = null;
                }

                if (multiplier > 12.0 && !recordedCrash) {
                    recordedCrash = true;
                    addNewHistory(multiplier);
                    if (isBetPlaced && !hasCashedOut) {
                        isBetPlaced = false; // انتهت الجولة وخسر الرهان إذا لم يسحب
                    }
                }
            }
        }, 100);
    </script>
</body>
</html>
