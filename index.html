<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leader Epic - Hub</title>
    <!-- جلب مكتبة تليجرام WebApp الرسمية -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-primary: #0f0f13;
            --bg-card: #1a1a24;
            --bg-modal: #1e1e2e;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --blue: #38bdf8;
            --blue-dark: #2563eb;
            --green: #4ade80;
            --red: #dc2626;
            --purple: #a855f7;
            --gold: #f59e0b;
            --border: #2a2a3a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }

        body { 
            background: linear-gradient(180deg, #0f0f13 0%, #1a1a24 100%);
            color: var(--text-primary); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            padding-bottom: 90px;
            overflow-x: hidden;
        }

        .top-header { 
            width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; padding: 15px 16px; position: relative; z-index: 10;
        }
        .header-user { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border); background: #2a2a3a; }
        .user-info-text { display: flex; flex-direction: column; }
        .user-label { font-size: 11px; color: var(--text-secondary); }
        .balance-row { display: flex; align-items: center; gap: 4px; font-weight: bold; font-size: 14px; color: var(--blue); }
        
        .gift-badge { 
            background: rgba(168, 85, 247, 0.15); border: 1px solid rgba(168, 85, 247, 0.3); padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; color: var(--purple);
            display: flex; align-items: center; gap: 6px;
        }

        .deposit-btn {
            background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary); padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 4px;
        }

        .live-gifts-bar {
            width: 100%; max-width: 480px; padding: 10px 16px; display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; direction: ltr; margin-bottom: 5px;
        }
        .live-gifts-bar::-webkit-scrollbar { display: none; }
        .gift-pill {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 8px 10px; display: flex; align-items: center; justify-content: center; min-width: 48px; height: 48px; font-size: 20px; flex-shrink: 0;
        }

        .games-container {
            width: calc(100% - 32px); max-width: 448px; display: flex; flex-direction: column; gap: 14px; margin-top: 5px;
        }

        .game-banner {
            width: 100%; height: 110px; border-radius: 20px; padding: 16px; position: relative; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid rgba(255, 255, 255, 0.1); transition: transform 0.2s ease;
        }
        .game-banner:active { transform: scale(0.98); }

        .banner-rocket { background: linear-gradient(135deg, #1e3a8a 0%, #1e1b4b 100%); border-color: rgba(56, 189, 248, 0.3); }
        .banner-pvp { background: linear-gradient(135deg, #78350f 0%, #451a03 100%); border-color: rgba(245, 158, 11, 0.3); }
        .banner-hub { background: linear-gradient(135deg, #581c87 0%, #3b0764 100%); border-color: rgba(168, 85, 247, 0.3); }

        .banner-header { display: flex; justify-content: space-between; align-items: center; }
        .tag-hot { background: rgba(56, 189, 248, 0.2); color: var(--blue); font-size: 10px; font-weight: bold; padding: 3px 8px; border-radius: 8px; border: 1px solid rgba(56, 189, 248, 0.4); }
        .tag-new { background: rgba(245, 158, 11, 0.2); color: var(--gold); font-size: 10px; font-weight: bold; padding: 3px 8px; border-radius: 8px; border: 1px solid rgba(245, 158, 11, 0.4); }
        .game-title { font-size: 18px; font-weight: 900; letter-spacing: 0.5px; color: white; display: flex; align-items: center; gap: 6px; }

        .view-section { display: none; width: 100%; flex-direction: column; align-items: center; }
        .view-section.active { display: flex; }

        .game-card { 
            width: calc(100% - 32px); max-width: 448px; background: var(--bg-card); border-radius: 24px; padding: 25px 20px; display: flex; flex-direction: column; align-items: center; position: relative; border: 1px solid var(--border); box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .rocket-stage { height: 200px; display: flex; justify-content: center; align-items: center; position: relative; width: 100%; overflow: hidden; }
        .stars { position: absolute; width: 100%; height: 100%; pointer-events: none; }
        .star { position: absolute; width: 2px; height: 2px; background: white; border-radius: 50%; animation: twinkle 2s ease-in-out infinite; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        .rocket-icon { font-size: 70px; position: relative; z-index: 2; transition: all 0.3s ease; filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.6)); }
        .rocket-icon.flying { animation: rocketFly 1s ease-in-out infinite; }
        @keyframes rocketFly { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-15px) rotate(3deg); } }
        .rocket-icon.waiting { animation: rocketIdle 2s ease-in-out infinite; }
        @keyframes rocketIdle { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
        .rocket-icon.exploded { animation: explode 0.5s ease forwards; }
        @keyframes explode { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.5; } 100% { transform: scale(0); opacity: 0; } }

        .multiplier-text { 
            font-size: 40px; font-weight: 900; margin: 10px 0 20px 0; color: var(--text-primary); letter-spacing: 1px;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.2); transition: all 0.2s;
        }
        .multiplier-text.crashed { color: var(--red); text-shadow: 0 0 30px rgba(220, 38, 38, 0.5); }

        .action-btn { width: 100%; padding: 16px; border: none; border-radius: 16px; font-size: 16px; font-weight: bold; cursor: pointer; text-align: center; transition: all 0.3s ease; }
        .action-btn.place { background: linear-gradient(135deg, #2563eb, #1e40af); color: white; }
        .action-btn.cancel-btn { background: linear-gradient(135deg, #dc2626, #b91c1c); color: white; }
        .action-btn.cashout { background: linear-gradient(135deg, #16a34a, #15803d); color: white; }
        .action-btn.disabled { background: #2a2a3a; color: #666; cursor: not-allowed; }

        .players-section { width: calc(100% - 32px); max-width: 448px; margin-top: 15px; display: flex; flex-direction: column; gap: 8px; min-height: 50px; }
        .player-card { background: rgba(20, 83, 45, 0.3); border: 1px solid rgba(74, 222, 128, 0.3); border-radius: 16px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
        .player-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid var(--green); background: #2a2a3a; }
        .player-name { font-size: 14px; font-weight: 600; color: #f4f4f5; }
        .player-sub { font-size: 12px; color: var(--green); margin-top: 3px; }
        .player-right { font-size: 14px; font-weight: bold; color: var(--green); background: rgba(74, 222, 128, 0.2); padding: 8px 14px; border-radius: 12px; border: 1px solid rgba(74, 222, 128, 0.3); }
        .no-players { font-size: 13px; color: #555; text-align: center; padding: 15px; background: rgba(42, 42, 58, 0.3); border-radius: 12px; border: 1px dashed #2a2a3a; }

        .history-bar { width: 100%; max-width: 480px; display: flex; gap: 6px; overflow-x: auto; padding: 8px 16px; margin-bottom: 10px; scrollbar-width: none; direction: ltr; }
        .history-bar::-webkit-scrollbar { display: none; }
        .hist-pill { padding: 6px 14px; border-radius: 10px; font-size: 12px; font-weight: bold; white-space: nowrap; }
        
        /* ألوان السجل الجديدة بالطلب */
        .h-red { background: rgba(220, 38, 38, 0.15); color: var(--red); border: 1px solid rgba(220, 38, 38, 0.3); }       /* من 1 إلى 1.20 */
        .h-green { background: rgba(74, 222, 128, 0.15); color: var(--green); border: 1px solid rgba(74, 222, 128, 0.3); }   /* من 1.20 إلى 1.9 */
        .h-purple { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); } /* من 2 إلى 8 */
        .h-gold { background: rgba(245, 158, 11, 0.15); color: var(--gold); border: 1px solid rgba(245, 158, 11, 0.3); }     /* من 9 إلى 100 */

        /* لوحة الصدارة الحقيقية */
        .leaderboard-container { width: calc(100% - 32px); max-width: 448px; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .lb-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
        .lb-left { display: flex; align-items: center; gap: 12px; }
        .lb-rank { font-weight: bold; font-size: 15px; color: var(--gold); width: 20px; text-align: center; }

        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; width: 100%; 
            background: rgba(26, 26, 36, 0.95); border-top: 1px solid var(--border); 
            display: flex; justify-content: space-around; padding: 10px 0 20px 0; z-index: 100; 
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #666; font-size: 10px; cursor: pointer; background: none; border: none; }
        .nav-item.active { color: var(--purple); }
        .nav-icon { font-size: 20px; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: flex-end; z-index: 200; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content { background: var(--bg-modal); width: 100%; max-width: 480px; border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 25px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 18px; transform: translateY(100%); transition: transform 0.3s ease; }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 18px; }
        .close-modal { background: #2a2a3a; border: none; color: #999; width: 35px; height: 35px; border-radius: 50%; font-size: 18px; cursor: pointer; }
        .custom-input { width: 100%; background: #2a2a3a; border: 1px solid #3a3a4a; border-radius: 12px; padding: 14px; font-size: 16px; color: white; outline: none; }
        .toggle-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #d4d4d8; }
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #3a3a4a; transition: .3s; border-radius: 26px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--blue-dark); }
        input:checked + .slider:before { transform: translateX(24px); }

        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: var(--bg-card); border: 1px solid var(--border); padding: 12px 20px; border-radius: 12px; font-size: 14px; font-weight: bold; z-index: 300; transition: all 0.3s ease; opacity: 0; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.success { border-color: var(--green); color: var(--green); }
        .toast.error { border-color: var(--red); color: var(--red); }
    </style>
</head>
<body>

    <div class="toast" id="toast"></div>

    <!-- الهيدر الموحد -->
    <div class="top-header">
        <div class="header-user">
            <img id="userAvatarImg" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" class="user-avatar" alt="Profile">
            <div class="user-info-text">
                <span class="user-label" id="userNameLabel">Leader</span>
                <div class="balance-row">
                    <span>🪙</span>
                    <span id="userBalance">0.000</span> TON
                </div>
            </div>
        </div>
        <div class="gift-badge">🎁 Leader Epic</div>
        <a href="https://t.me/isXcvc" target="_blank" class="deposit-btn">+ Deposit</a>
    </div>

    <!-- الواجهة الرئيسية (HOME HUB) -->
    <div id="homeView" class="view-section active">
        <div class="live-gifts-bar">
            <div class="gift-pill">🪙</div>
            <div class="gift-pill">🐰</div>
            <div class="gift-pill">🚀</div>
            <div class="gift-pill">🪙</div>
            <div class="gift-pill">💎</div>
            <div class="gift-pill">🥑</div>
            <div class="gift-pill">🐶</div>
        </div>

        <div class="games-container">
            <div class="game-banner banner-rocket" onclick="switchView('rocket')">
                <div class="banner-header">
                    <span class="tag-hot">🔥 HOT!</span>
                    <span style="font-size: 12px; color: var(--blue);">انقر للبدء ↗</span>
                </div>
                <div class="game-title">🚀 ROCKET</div>
            </div>

            <div class="game-banner banner-pvp" onclick="showToast('قريباً قريباً!', 'error')">
                <div class="banner-header">
                    <span class="tag-new">⭐ NEW!</span>
                </div>
                <div class="game-title">⚔️ PVP Arena</div>
            </div>

            <div class="game-banner banner-hub" onclick="showToast('قريباً!', 'error')">
                <div class="banner-header">
                    <span class="tag-hot">🔥 HOT!</span>
                </div>
                <div class="game-title">🎮 PLAY HUB</div>
            </div>
        </div>
    </div>

    <!-- واجهة لعبة الصاروخ (ROCKET GAME) -->
    <div id="rocketView" class="view-section">
        <div style="width: 100%; max-width: 480px; padding: 0 16px; margin-bottom: 10px; display: flex; justify-content: flex-start;">
            <button onclick="switchView('home')" style="background: var(--bg-card); border: 1px solid var(--border); color: white; padding: 6px 14px; border-radius: 14px; cursor: pointer; font-size: 13px;">‹ رجوع للرئيسية</button>
        </div>

        <div class="history-bar" id="historyBar"></div>

        <div class="game-card">
            <div class="rocket-stage">
                <div class="stars" id="starsContainer"></div>
                <div class="rocket-icon waiting" id="rocketEmoji">🚀</div>
            </div>
            <!-- أثناء اللعب يكون الرقم أبيض اللون تماماً حسب الطلب -->
            <div class="multiplier-text" id="multiplierDisplay" style="color: var(--text-primary); text-shadow: none;">1.00x</div>
            <button class="action-btn place" id="mainBtn" onclick="openBetModal()">Place bet</button>
        </div>

        <div class="players-section" id="playersSection">
            <div class="no-players">لا توجد رهانات نشطة في هذه الجولة</div>
        </div>
    </div>

    <!-- واجهة لوحة الصدارة (LEADERBOARD) -->
    <div id="leaderboardView" class="view-section">
        <div style="width: 100%; max-width: 480px; padding: 10px 16px; font-weight: bold; font-size: 18px; color: var(--gold);">
            🏆 لوحة الصدارة (أكثر المستخدمين تفاعلاً)
        </div>
        <div class="leaderboard-container" id="leaderboardList">
            <div class="no-players">جاري تحميل القائمة...</div>
        </div>
    </div>

    <!-- نافذة الرهان -->
    <div class="modal-overlay" id="betModal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="betTitle">Place bet</span>
                <button class="close-modal" onclick="closeBetModal()">✕</button>
            </div>
            
            <div style="display: flex; justify-content: space-between; font-size: 12px; color: #888;">
                <span>الرصيد المتاح</span>
                <span><span id="modalBalance">0.000</span> TON</span>
            </div>

            <div>
                <label style="font-size: 12px; color: #888; display: block; margin-bottom: 6px;">مبلغ الرهان (TON):</label>
                <input type="number" id="customBetInput" class="custom-input" value="1.00" step="0.1" min="0.1" max="100">
                <div style="display: flex; gap: 8px; margin-top: 8px;">
                    <button onclick="setQuickAmount(0.5)" style="flex:1; background:#2a2a3a; border:1px solid #3a3a4a; color:white; padding:8px; border-radius:8px; cursor:pointer; font-size:12px;">0.5</button>
                    <button onclick="setQuickAmount(1)" style="flex:1; background:#2a2a3a; border:1px solid #3a3a4a; color:white; padding:8px; border-radius:8px; cursor:pointer; font-size:12px;">1.0</button>
                    <button onclick="setQuickAmount(2)" style="flex:1; background:#2a2a3a; border:1px solid #3a3a4a; color:white; padding:8px; border-radius:8px; cursor:pointer; font-size:12px;">2.0</button>
                </div>
            </div>

            <div class="toggle-row">
                <span>السحب التلقائي</span>
                <label class="switch">
                    <input type="checkbox" id="autoCashoutSwitch" onchange="toggleAutoInput()">
                    <span class="slider"></span>
                </label>
            </div>

            <div id="autoTargetContainer" style="display: none;">
                <label style="font-size: 12px; color: #888; display: block; margin-bottom: 6px;">اسحب عند المضاعف:</label>
                <input type="number" id="autoTargetInput" class="custom-input" value="2.00" step="0.1" min="1.1" max="100">
            </div>

            <button class="action-btn place" onclick="confirmBet()">تأكيد الرهان</button>
        </div>
    </div>

    <!-- القائمة السفلية الثابتة -->
    <div class="bottom-nav">
        <button class="nav-item" onclick="showToast('قريباً!', 'error')"><span class="nav-icon">🎒</span>Backpack</button>
        <button class="nav-item" onclick="showToast('قريباً!', 'error')"><span class="nav-icon">🎁</span>Invite</button>
        <button class="nav-item active" id="navHome" onclick="switchView('home')"><span class="nav-icon">🏠</span>Home</button>
        <button class="nav-item" id="navLb" onclick="switchView('leaderboard')"><span class="nav-icon">🏆</span>Leaderboard</button>
        <button class="nav-item" onclick="showToast('قريباً!', 'error')"><span class="nav-icon">🪙</span>Earn</button>
    </div>

    <script>
        // دمج بيانات حساب تيليجرام الحقيقي للمستخدم
        let tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg && typeof tg.expand === 'function') {
            try { tg.expand(); } catch (e) { /* ignore if not allowed */ }
        }

        let currentUser = {
            id: 466601881,
            name: "Leader",
            username: "LeaderUser",
            photo: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150"
        };

        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
            let u = tg.initDataUnsafe.user;
            currentUser.id = u.id;
            currentUser.name = u.first_name + (u.last_name ? ' ' + u.last_name : '');
            currentUser.username = u.username ? '@' + u.username : 'User_' + u.id;
            if (u.photo_url) {
                currentUser.photo = u.photo_url;
            }
        }

        // تحديث الهيدر ببيانات المستخدم الحقيقية
        document.getElementById('userNameLabel').innerText = currentUser.name;
        document.getElementById('userAvatarImg').src = currentUser.photo;

        let state = {
            balance: 10.000, // رصيد افتتاحي تجريبي للتنقل
            currentBetAmount: 0,
            isBetPlaced: false,
            hasCashedOut: false,
            currentWinnings: 0,
            cashoutMultiplier: 0,
            gameHistory: [1.15, 2.40, 1.05, 15.50, 4.20],
            crashPoint: 1.00,
            currentMultiplier: 1.00,
            gamePhase: 'waiting',
            waitRemaining: 9.0,
            lastTimestamp: null,
            flightTime: 0,
            // new fields for auto-cashout stored in state
            autoCashoutEnabled: false,
            autoTarget: 0
        };

        function switchView(viewName) {
            document.getElementById('homeView').classList.remove('active');
            document.getElementById('rocketView').classList.remove('active');
            document.getElementById('leaderboardView').classList.remove('active');
            document.getElementById('navHome').classList.remove('active');
            document.getElementById('navLb').classList.remove('active');

            if (viewName === 'home') {
                document.getElementById('homeView').classList.add('active');
                document.getElementById('navHome').classList.add('active');
            } else if (viewName === 'rocket') {
                document.getElementById('rocketView').classList.add('active');
                createStars();
                renderHistory();
            } else if (viewName === 'leaderboard') {
                document.getElementById('leaderboardView').classList.add('active');
                document.getElementById('navLb').classList.add('active');
                loadLeaderboard();
            }
        }

        function createStars() {
            const container = document.getElementById('starsContainer');
            container.innerHTML = '';
            for (let i = 0; i < 25; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(star);
            }
        }

        function generateCrashPoint() {
            const random = Math.random();
            if (random < 0.3) return 1.0 + Math.random() * 0.2; // 1.0 - 1.2 (أحمر)
            else if (random < 0.6) return 1.201 + Math.random() * 0.699; // 1.20 - 1.9 (أخضر)
            else if (random < 0.85) return 2.0 + Math.random() * 6.0; // 2 - 8 (بنفسجي)
            else return 9.0 + Math.random() * 91.0; // 9 - 100 (ذهبي)
        }

        function updateBalanceUI() {
            document.getElementById('userBalance').innerText = state.balance.toFixed(3);
            document.getElementById('modalBalance').innerText = state.balance.toFixed(3);
        }

        let toastTimer = null;
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.className = 'toast ' + type + ' show';
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function setQuickAmount(amount) {
            document.getElementById('customBetInput').value = amount;
        }

        function toggleAutoInput() {
            const isChecked = document.getElementById('autoCashoutSwitch').checked;
            document.getElementById('autoTargetContainer').style.display = isChecked ? 'block' : 'none';
        }

        function openBetModal() {
            if (state.gamePhase !== 'waiting') {
                showToast('انتظر الجولة القادمة', 'error');
                return;
            }
            // Update modal balance & auto values with current state
            document.getElementById('modalBalance').innerText = state.balance.toFixed(3);
            // restore auto switch UI from state if needed
            document.getElementById('autoCashoutSwitch').checked = state.autoCashoutEnabled;
            document.getElementById('autoTargetContainer').style.display = state.autoCashoutEnabled ? 'block' : 'none';
            if (state.autoTarget && state.autoTarget > 1) {
                document.getElementById('autoTargetInput').value = state.autoTarget.toFixed(2);
            }
            document.getElementById('betModal').classList.add('active');
        }

        function closeBetModal() {
            document.getElementById('betModal').classList.remove('active');
        }

        function confirmBet() {
            const inputEl = document.getElementById('customBetInput');
            const inputVal = parseFloat(inputEl.value);
            if (isNaN(inputVal) || inputVal <= 0 || inputVal > state.balance) {
                showToast('المبلغ غير صالح أو رصيدك غير كافٍ', 'error');
                return;
            }

            // read auto-cashout settings from modal and validate
            const autoEnabled = document.getElementById('autoCashoutSwitch').checked;
            let target = parseFloat(document.getElementById('autoTargetInput').value);
            if (autoEnabled) {
                if (isNaN(target) || target <= 1.0) {
                    showToast('حدد مضاعف سحب صالح (> 1.0)', 'error');
                    return;
                }
                state.autoCashoutEnabled = true;
                state.autoTarget = target;
            } else {
                state.autoCashoutEnabled = false;
                state.autoTarget = 0;
            }

            state.currentBetAmount = roundTon(inputVal);
            state.balance = roundTon(state.balance - state.currentBetAmount);
            state.isBetPlaced = true;
            state.hasCashedOut = false;
            updateBalanceUI();
            closeBetModal();
            updatePlayersUI('waiting');
            updateButton('cancel');
        }

        function cancelBet() {
            if (state.gamePhase !== 'waiting') return;
            if (!state.isBetPlaced) return;
            state.balance = roundTon(state.balance + state.currentBetAmount);
            state.isBetPlaced = false;
            state.currentBetAmount = 0;
            updateBalanceUI();
            updatePlayersUI('empty');
            updateButton('place');
        }

        function roundTon(val) { return Math.round(val * 1000) / 1000; }

        function cashOut() {
            if (!state.isBetPlaced || state.hasCashedOut || state.gamePhase !== 'flying') return;
            // protect against cashing at or after crash
            if (state.currentMultiplier >= state.crashPoint) return;
            state.hasCashedOut = true;
            state.cashoutMultiplier = state.currentMultiplier;
            state.currentWinnings = roundTon(state.currentBetAmount * state.cashoutMultiplier);
            state.balance = roundTon(state.balance + state.currentWinnings);
            // clear bet state
            state.isBetPlaced = false;
            state.currentBetAmount = 0;
            updateBalanceUI();
            updatePlayersUI('cashed');
            updateButton('disabled');
            showToast(`ربحت ${state.currentWinnings.toFixed(3)} TON`, 'success');
        }

        function updateButton(type) {
            const btn = document.getElementById('mainBtn');
            btn.className = 'action-btn';
            btn.disabled = false;
            btn.onclick = null;
            if (type === 'place') { btn.innerText = 'Place bet'; btn.classList.add('place'); btn.onclick = openBetModal; }
            else if (type === 'cancel') { btn.innerText = 'Cancel Bet'; btn.classList.add('cancel-btn'); btn.onclick = cancelBet; }
            else if (type === 'cashout') { btn.innerText = 'Cash Out'; btn.classList.add('cashout'); btn.onclick = cashOut; }
            else if (type === 'disabled') { btn.innerText = 'انتظر الجولة القادمة...'; btn.classList.add('disabled'); btn.disabled = true; }
            else if (type === 'crashed') { btn.innerText = '💥 انفجر!'; btn.classList.add('disabled'); btn.disabled = true; }
        }

        // تحديث واجهة اللاعب لتظهر "عداد ربحي" متحرك بدل كلمة قيد الانتظار
        function updatePlayersUI(status) {
            const container = document.getElementById('playersSection');
            container.innerHTML = '';
            if (!state.isBetPlaced && status !== 'cashed' && status !== 'crashed' && status !== 'waiting') {
                container.innerHTML = '<div class="no-players">لا توجد رهانات نشطة في هذه الجولة</div>';
                return;
            }
            if (!state.isBetPlaced && status === 'waiting') {
                container.innerHTML = '<div class="no-players">لا توجد رهانات نشطة في هذه الجولة</div>';
                return;
            }

            const card = document.createElement('div');
            card.className = 'player-card';
            let subTxt = '', rightTxt = '';
            
            if (status === 'waiting') { 
                subTxt = `${state.currentBetAmount.toFixed(3)} TON`; 
                rightTxt = '⏳ قيد الانتظار...'; 
            } else if (status === 'flying') {
                subTxt = `${state.currentBetAmount.toFixed(3)} TON`;
                let liveWin = roundTon(state.currentBetAmount * state.currentMultiplier);
                rightTxt = `📈 ${liveWin.toFixed(3)} TON`; // عداد ربحي حي أثناء الطيران
            } else if (status === 'cashed') { 
                subTxt = `${state.currentWinnings.toFixed(3)} TON (${state.cashoutMultiplier.toFixed(2)}x)`; 
                rightTxt = `+${state.currentWinnings.toFixed(3)} 💰`; 
            } else if (status === 'crashed') { 
                subTxt = `خسرت ${state.currentBetAmount.toFixed(3)} TON`; 
                rightTxt = `-${state.currentBetAmount.toFixed(3)}`; 
                card.style.background = 'rgba(220,38,38,0.2)'; 
            }

            card.innerHTML = `<div class="player-info"><img src="${currentUser.photo}" class="avatar"><div><div class="player-name">${currentUser.name}</div><div class="player-sub">${subTxt}</div></div></div><div class="player-right">${rightTxt}</div>`;
            container.appendChild(card);
        }

        // تحديد اللون بدقة حسب القواعد المطلوبة للسجل بعد انتهاء الجولة
        function getHistoryClass(m) {
            if (m >= 1.0 && m <= 1.20) return 'h-red';       // أصفر/أحمر حسب وصفك (1 الى 1.20)
            if (m > 1.20 && m <= 1.9) return 'h-green';     // أخضر (1.20 إلى 1.9)
            if (m >= 2.0 && m <= 8.0) return 'h-purple';    // بنفسجي (2 إلى 8)
            return 'h-gold';                                // ذهبي (9 إلى 100)
        }

        function addHistory(mult) {
            state.gameHistory.unshift(mult);
            if (state.gameHistory.length > 10) state.gameHistory.pop();
            renderHistory();
        }

        function renderHistory() {
            const bar = document.getElementById('historyBar');
            bar.innerHTML = '';
            state.gameHistory.forEach(m => {
                let cls = getHistoryClass(m);
                const pill = document.createElement('div');
                pill.className = `hist-pill ${cls}`;
                pill.innerText = m.toFixed(2) + 'x';
                bar.appendChild(pill);
            });
        }

        function startNewRound() {
            state.gamePhase = 'flying';
            state.crashPoint = generateCrashPoint();
            state.currentMultiplier = 1.00;
            state.flightTime = 0;
            // reset timestamp to avoid big delta from wait phase
            state.lastTimestamp = performance.now();
            document.getElementById('rocketEmoji').className = 'rocket-icon flying';
            if (state.isBetPlaced && !state.hasCashedOut) updateButton('cashout');
            else updateButton('disabled');
        }

        function endRound() {
            state.gamePhase = 'crashed';
            document.getElementById('rocketEmoji').className = 'rocket-icon exploded';
            document.getElementById('multiplierDisplay').innerText = '💥 ' + state.crashPoint.toFixed(2) + 'x';
            addHistory(state.crashPoint);

            if (state.isBetPlaced && !state.hasCashedOut) {
                updatePlayersUI('crashed');
                updateButton('crashed');
                // keep the displayed lost amount for a short while, then clear
                setTimeout(() => { state.isBetPlaced = false; state.currentBetAmount = 0; }, 2000);
            }

            // prepare next waiting phase after short animation
            setTimeout(() => {
                state.gamePhase = 'waiting';
                state.waitRemaining = 9.0;
                // reset timestamp to avoid large dt when waiting resumes
                state.lastTimestamp = performance.now();
                document.getElementById('rocketEmoji').className = 'rocket-icon waiting';
                document.getElementById('multiplierDisplay').innerText = '1.00x';
                if (!state.isBetPlaced) { updateButton('place'); updatePlayersUI('empty'); }
                else updateButton('cancel');
            }, 3000);
        }

        function gameLoopTick(now) {
            if (!state.lastTimestamp) state.lastTimestamp = now;
            const dt = (now - state.lastTimestamp) / 1000;
            state.lastTimestamp = now;

            if (state.gamePhase === 'waiting') {
                state.waitRemaining = Math.max(0, state.waitRemaining - dt);
                document.getElementById('multiplierDisplay').innerText = `يبدأ خلال ${Math.ceil(state.waitRemaining)}s`;
                if (state.waitRemaining <= 0) startNewRound();
            } else if (state.gamePhase === 'flying') {
                state.flightTime += dt;
                // multiplier growth formula
                state.currentMultiplier = 1.00 + (Math.pow(1.35, state.flightTime) - 1) * 0.35;
                if (state.currentMultiplier >= state.crashPoint) {
                    state.currentMultiplier = state.crashPoint;
                    endRound();
                    // schedule next tick and exit this frame early
                    requestAnimationFrame(gameLoopTick);
                    return;
                }
                document.getElementById('multiplierDisplay').innerText = state.currentMultiplier.toFixed(2) + 'x';
                
                // تحديث العداد الربحي الحي للمستخدم أثناء الطيران
                if (state.isBetPlaced && !state.hasCashedOut) {
                    updatePlayersUI('flying');
                }

                // auto-cashout now reads from state (set at confirmBet)
                if (state.isBetPlaced && !state.hasCashedOut && state.autoCashoutEnabled && state.autoTarget) {
                    if (state.currentMultiplier >= state.autoTarget) cashOut();
                }
            }
            requestAnimationFrame(gameLoopTick);
        }

        function loadLeaderboard() {
            const list = document.getElementById('leaderboardList');
            // محاكاة قائمة مستخدمين حقيقيين من قاعدة البيانات
            const realUsers = [
                { rank: 1, name: currentUser.name, profit: "142.50 TON", photo: currentUser.photo },
                { rank: 2, name: "Ahmed Al-Sudani", profit: "98.20 TON", photo: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150" },
                { rank: 3, name: "Mustafa K.", profit: "64.00 TON", photo: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150" },
                { rank: 4, name: "Zainab Ali", profit: "45.10 TON", photo: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150" }
            ];
            list.innerHTML = '';
            realUsers.forEach(u => {
                list.innerHTML += `
                    <div class="lb-item">
                        <div class="lb-left">
                            <span class="lb-rank">#${u.rank}</span>
                            <img src="${u.photo}" class="avatar" style="width:38px;height:38px;">
                            <span style="font-size:14px; font-weight:600;">${u.name}</span>
                        </div>
                        <span style="font-size:14px; font-weight:bold; color:var(--green);">${u.profit}</span>
                    </div>
                `;
            });
        }

        renderHistory();
        updateBalanceUI();
        state.lastTimestamp = null; // let the game loop set the first timestamp
        requestAnimationFrame(gameLoopTick);
    </script>
</body>
</html>
