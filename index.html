<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leader - Rocket</title>
    <style>
        :root {
            --bg-primary: #0f0f13;
            --bg-card: #1a1a24;
            --bg-modal: #1e1e2e;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --blue: #38bdf8;
            --blue-dark: #2563eb;
            --green: #4ade80;
            --green-dark: #14532d;
            --red: #dc2626;
            --purple: #a855f7;
            --gold: #f59e0b;
            --border: #2a2a3a;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
        }

        body { 
            background: linear-gradient(180deg, #0f0f13 0%, #1a1a24 100%);
            color: var(--text-primary); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            padding-bottom: 80px;
            overflow-x: hidden;
        }

        .top-header { 
            width: 100%; 
            max-width: 480px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 15px 16px; 
            position: relative;
            z-index: 10;
        }
        .back-btn { 
            background: var(--bg-card); 
            border: 1px solid var(--border); 
            padding: 8px 16px; 
            border-radius: 20px; 
            font-size: 13px; 
            font-weight: bold; 
            color: var(--text-primary); 
            cursor: pointer; 
        }
        .gift-badge { 
            background: rgba(168, 85, 247, 0.15); 
            border: 1px solid rgba(168, 85, 247, 0.3); 
            padding: 8px 16px; 
            border-radius: 20px; 
            font-size: 13px; 
            font-weight: bold; 
            color: var(--purple);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .user-avatar-small {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border);
        }
        .balance-container { 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            background: var(--bg-card); 
            padding: 6px 12px; 
            border-radius: 20px; 
            border: 1px solid var(--border); 
        }
        .balance-value { 
            font-weight: bold; 
            font-size: 14px; 
            color: var(--blue); 
        }
        .add-btn { 
            background: #3a3a4a; 
            border: none; 
            color: white; 
            width: 22px; 
            height: 22px; 
            border-radius: 50%; 
            font-weight: bold; 
            cursor: pointer; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .history-bar { 
            width: 100%; 
            max-width: 480px; 
            display: flex; 
            gap: 6px; 
            overflow-x: auto; 
            padding: 8px 16px; 
            margin-bottom: 10px; 
            scrollbar-width: none; 
            direction: ltr;
        }
        .history-bar::-webkit-scrollbar { display: none; }
        .hist-pill { 
            padding: 6px 14px; 
            border-radius: 10px; 
            font-size: 12px; 
            font-weight: bold; 
            white-space: nowrap;
            animation: slideIn 0.5s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .h-green { background: rgba(74, 222, 128, 0.15); color: var(--green); border: 1px solid rgba(74, 222, 128, 0.3); }
        .h-purple { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }
        .h-gold { background: rgba(245, 158, 11, 0.15); color: var(--gold); border: 1px solid rgba(245, 158, 11, 0.3); }

        .game-card { 
            width: calc(100% - 32px); 
            max-width: 448px; 
            background: var(--bg-card); 
            border-radius: 24px; 
            padding: 25px 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            position: relative; 
            border: 1px solid var(--border); 
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .rocket-stage { 
            height: 200px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            position: relative; 
            width: 100%;
            overflow: hidden;
        }
        
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s ease-in-out infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .rocket-icon { 
            font-size: 70px; 
            position: relative;
            z-index: 2;
            transition: all 0.3s ease;
            filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.6));
        }
        .rocket-icon.flying {
            animation: rocketFly 1s ease-in-out infinite;
        }
        @keyframes rocketFly {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-15px) rotate(3deg); }
        }
        .rocket-icon.waiting {
            animation: rocketIdle 2s ease-in-out infinite;
        }
        @keyframes rocketIdle {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }
        .rocket-icon.exploded {
            animation: explode 0.5s ease forwards;
        }
        @keyframes explode {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(0); opacity: 0; }
        }

        .multiplier-text { 
            font-size: 40px; 
            font-weight: 900; 
            margin: 10px 0 20px 0; 
            color: var(--blue); 
            letter-spacing: 1px;
            text-shadow: 0 0 30px rgba(56, 189, 248, 0.5);
            transition: all 0.2s;
        }
        .multiplier-text.crashed {
            color: var(--red);
            text-shadow: 0 0 30px rgba(220, 38, 38, 0.5);
            animation: crashShake 0.5s ease;
        }
        @keyframes crashShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .action-btn { 
            width: 100%; 
            padding: 16px; 
            border: none; 
            border-radius: 16px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            text-align: center; 
            transition: all 0.3s ease; 
        }
        .action-btn.place { 
            background: linear-gradient(135deg, #2563eb, #1e40af); 
            color: white; 
        }
        .action-btn.place:hover { 
            box-shadow: 0 5px 20px rgba(37, 99, 235, 0.5);
            transform: translateY(-2px);
        }
        .action-btn.cancel-btn { 
            background: linear-gradient(135deg, #dc2626, #b91c1c); 
            color: white; 
        }
        .action-btn.cashout { 
            background: linear-gradient(135deg, #16a34a, #15803d); 
            color: white; 
            animation: pulseGreen 1s ease-in-out infinite;
        }
        @keyframes pulseGreen {
            0%, 100% { box-shadow: 0 5px 20px rgba(22, 163, 74, 0.4); }
            50% { box-shadow: 0 8px 40px rgba(22, 163, 74, 0.8); }
        }
        .action-btn.disabled { 
            background: #2a2a3a; 
            color: #666; 
            cursor: not-allowed; 
        }

        .players-section { 
            width: calc(100% - 32px); 
            max-width: 448px; 
            margin-top: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            min-height: 50px; 
        }
        .player-card { 
            background: rgba(20, 83, 45, 0.3); 
            border: 1px solid rgba(74, 222, 128, 0.3); 
            border-radius: 16px; 
            padding: 12px 16px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }
        .player-info { display: flex; align-items: center; gap: 12px; }
        .avatar { 
            width: 45px; 
            height: 45px; 
            border-radius: 50%; 
            object-fit: cover;
            border: 2px solid var(--green);
            background: #2a2a3a;
        }
        .player-name { font-size: 14px; font-weight: 600; color: #f4f4f5; }
        .player-sub { 
            font-size: 12px; 
            color: var(--green); 
            margin-top: 3px; 
        }
        .player-right { 
            font-size: 14px; 
            font-weight: bold; 
            color: var(--green); 
            background: rgba(74, 222, 128, 0.2); 
            padding: 8px 14px; 
            border-radius: 12px; 
            border: 1px solid rgba(74, 222, 128, 0.3); 
        }
        .no-players { 
            font-size: 13px; 
            color: #555; 
            text-align: center; 
            padding: 15px;
            background: rgba(42, 42, 58, 0.3);
            border-radius: 12px;
            border: 1px dashed #2a2a3a;
        }

        .bottom-nav { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            background: rgba(26, 26, 36, 0.95); 
            border-top: 1px solid var(--border); 
            display: flex; 
            justify-content: space-around; 
            padding: 10px 0 20px 0; 
            z-index: 100; 
        }
        .nav-item { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 4px; 
            color: #666; 
            font-size: 10px; 
            cursor: pointer; 
            background: none;
            border: none;
        }
        .nav-item.active { color: var(--purple); }
        .nav-icon { font-size: 20px; }

        .modal-overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.8); 
            display: flex; 
            justify-content: center; 
            align-items: flex-end; 
            z-index: 200; 
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-content { 
            background: var(--bg-modal); 
            width: 100%; 
            max-width: 480px; 
            border-top-left-radius: 24px; 
            border-top-right-radius: 24px; 
            padding: 25px; 
            border-top: 1px solid var(--border); 
            display: flex; 
            flex-direction: column; 
            gap: 18px;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }
        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }
        .modal-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-weight: bold; 
            font-size: 18px; 
        }
        .close-modal { 
            background: #2a2a3a; 
            border: none; 
            color: #999; 
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 18px; 
            cursor: pointer;
        }
        
        .custom-input { 
            width: 100%; 
            background: #2a2a3a; 
            border: 1px solid #3a3a4a; 
            border-radius: 12px; 
            padding: 14px; 
            font-size: 16px; 
            color: white; 
            outline: none;
        }
        .custom-input:focus {
            border-color: var(--blue);
        }
        .toggle-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-size: 14px; 
            color: #d4d4d8; 
        }
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { 
            position: absolute; 
            cursor: pointer; 
            top: 0; 
            left: 0; 
            right: 0; 
            bottom: 0; 
            background-color: #3a3a4a; 
            transition: .3s; 
            border-radius: 26px; 
        }
        .slider:before { 
            position: absolute; 
            content: ""; 
            height: 20px; 
            width: 20px; 
            left: 3px; 
            bottom: 3px; 
            background-color: white; 
            transition: .3s; 
            border-radius: 50%; 
        }
        input:checked + .slider { background-color: var(--blue-dark); }
        input:checked + .slider:before { transform: translateX(24px); }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            z-index: 300;
            transition: all 0.3s ease;
            opacity: 0;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .toast.success { border-color: var(--green); color: var(--green); }
        .toast.error { border-color: var(--red); color: var(--red); }
    </style>
</head>
<body>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="top-header">
        <div class="header-left">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" class="user-avatar-small" alt="Profile" id="headerAvatar">
            <div class="balance-container" aria-label="رصيد المستخدم">
                <span style="font-size: 11px; font-weight: bold; color: var(--blue);">💎</span>
                <span class="balance-value" id="userBalance">0.000</span>
                <button class="add-btn" onclick="addBalance()" aria-label="إضافة رصيد">+</button>
            </div>
        </div>
        <div class="gift-badge">🎁 Leader</div>
        <button class="back-btn" onclick="showToast('لا توجد صفحة سابقة', 'error')">إغلاق ✕</button>
    </div>

    <div class="history-bar" id="historyBar" aria-hidden="false"></div>

    <div class="game-card" role="region" aria-label="لعبة الصاروخ">
        <div class="rocket-stage" id="rocketStage">
            <div class="stars" id="starsContainer" aria-hidden="true"></div>
            <div class="rocket-icon waiting" id="rocketEmoji" aria-hidden="true">🚀</div>
        </div>
        <div class="multiplier-text" id="multiplierDisplay">1.00x</div>
        <button class="action-btn place" id="mainBtn" onclick="openBetModal()">Place bet</button>
    </div>

    <div class="players-section" id="playersSection" aria-live="polite">
        <div class="no-players">لا توجد رهانات نشطة في هذه الجولة</div>
    </div>

    <!-- نافذة الرهان -->
    <div class="modal-overlay" id="betModal" aria-hidden="true">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="betTitle">
            <div class="modal-header">
                <span id="betTitle">Place bet</span>
                <button class="close-modal" id="closeModalBtn" aria-label="إغلاق">✕</button>
            </div>
            
            <div style="display: flex; justify-content: space-between; font-size: 12px; color: #888;">
                <span>الرصيد المتاح</span>
                <span><span id="modalBalance">0.000</span> 💎</span>
            </div>

            <div>
                <label style="font-size: 12px; color: #888; display: block; margin-bottom: 6px;">مبلغ الرهان:</label>
                <input type="number" id="customBetInput" class="custom-input" value="1.00" step="0.1" min="0.1" max="100" aria-label="مبلغ الرهان">
                <div style="display: flex; gap: 8px; margin-top: 8px;">
                    <button onclick="setQuickAmount(0.5)" style="flex:1; background:#2a2a3a; border:1px solid #3a3a4a; color:white; padding:8px; border-radius:8px; cursor:pointer; font-size:12px;" type="button">0.5</button>
                    <button onclick="setQuickAmount(1)" style="flex:1; background:#2a2a3a; border:1px solid #3a3a4a; color:white; padding:8px; border-radius:8px; cursor:pointer; font-size:12px;" type="button">1.0</button>
                    <button onclick="setQuickAmount(2)" style="flex:1; background:#2a2a3a; border:1px solid #3a3a4a; color:white; padding:8px; border-radius:8px; cursor:pointer; font-size:12px;" type="button">2.0</button>
                </div>
            </div>

            <div class="toggle-row">
                <span>السحب التلقائي</span>
                <label class="switch">
                    <input type="checkbox" id="autoCashoutSwitch" onchange="toggleAutoInput()">
                    <span class="slider"></span>
                </label>
            </div>

            <div id="autoTargetContainer" style="display: none;">
                <label style="font-size: 12px; color: #888; display: block; margin-bottom: 6px;">اسحب عند المضاعف:</label>
                <input type="number" id="autoTargetInput" class="custom-input" value="2.00" step="0.1" min="1.1" max="10" aria-label="مضاعف السحب التلقائي">
            </div>

            <button class="action-btn place" id="confirmBetBtn" onclick="confirmBet()">تأكيد الرهان</button>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-item" onclick="showToast('قريباً!', 'error')"><span class="nav-icon">🎒</span>Backpack</button>
        <button class="nav-item" onclick="showToast('قريباً!', 'error')"><span class="nav-icon">🎁</span>Invite</button>
        <button class="nav-item active"><span class="nav-icon">🏠</span>Home</button>
        <button class="nav-item" onclick="showToast('قريباً!', 'error')"><span class="nav-icon">🏆</span>Leaderboard</button>
        <button class="nav-item" onclick="showToast('قريباً!', 'error')"><span class="nav-icon">🪙</span>Earn</button>
    </div>

    <script>
        // ===== حالة اللعبة =====
        let state = {
            balance: 0.000,
            currentBetAmount: 0,
            isBetPlaced: false,
            hasCashedOut: false,
            currentWinnings: 0,
            cashoutMultiplier: 0,
            isGameActive: false,
            canPlaceBet: true,
            gameHistory: [],
            crashPoint: 1.00,
            currentMultiplier: 1.00,
            gamePhase: 'waiting', 
            playerAvatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150', 
            waitRemaining: 9.0,
            lastTimestamp: null,
            flightTime: 0 // تتبع وقت الطيران لحساب السرعة التدريجية
        };

        function loadState() {
            const saved = localStorage.getItem('leader_rocket_state');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (typeof parsed.balance === 'number' && parsed.balance >= 0) {
                        state.balance = parsed.balance;
                    }
                    if (Array.isArray(parsed.history)) {
                        state.gameHistory = parsed.history;
                    }
                } catch (e) {}
            }
        }

        function saveState() {
            localStorage.setItem('leader_rocket_state', JSON.stringify({
                balance: state.balance,
                history: state.gameHistory
            }));
        }

        function createStars() {
            const container = document.getElementById('starsContainer');
            container.innerHTML = '';
            for (let i = 0; i < 25; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(star);
            }
        }

        function generateCrashPoint() {
            const random = Math.random();
            if (random < 0.25) return 1.0 + Math.random() * 0.3;
            else if (random < 0.45) return 1.3 + Math.random() * 0.7;
            else if (random < 0.65) return 2.0 + Math.random() * 1.5;
            else if (random < 0.80) return 3.5 + Math.random() * 2.5;
            else if (random < 0.92) return 6.0 + Math.random() * 6.0;
            else if (random < 0.97) return 12.0 + Math.random() * 13.0;
            else return 25.0 + Math.random() * 25.0;
        }

        function updateBalanceUI() {
            document.getElementById('userBalance').innerText = state.balance.toFixed(3);
            document.getElementById('modalBalance').innerText = state.balance.toFixed(3);
            saveState();
        }

        let toastTimer = null;
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.className = 'toast ' + type + ' show';
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        function addBalance() {
            state.balance = roundTon(state.balance + 1.000);
            updateBalanceUI();
            showToast('تمت إضافة 1.000 💎', 'success');
        }

        function setQuickAmount(amount) {
            document.getElementById('customBetInput').value = amount;
        }

        function toggleAutoInput() {
            const isChecked = document.getElementById('autoCashoutSwitch').checked;
            document.getElementById('autoTargetContainer').style.display = isChecked ? 'block' : 'none';
        }

        function openBetModal() {
            if (state.gamePhase !== 'waiting') {
                showToast('انتظر الجولة القادمة', 'error');
                return;
            }
            const overlay = document.getElementById('betModal');
            overlay.classList.add('active');
            overlay.setAttribute('aria-hidden', 'false');
            setTimeout(() => {
                const input = document.getElementById('customBetInput');
                if (input) input.focus();
            }, 100);
        }

        function closeBetModal() {
            const overlay = document.getElementById('betModal');
            overlay.classList.remove('active');
            overlay.setAttribute('aria-hidden', 'true');
            document.getElementById('mainBtn').focus();
        }

        function confirmBet() {
            const inputVal = parseFloat(document.getElementById('customBetInput').value);
            
            if (isNaN(inputVal) || inputVal <= 0) {
                showToast('الرجاء إدخال مبلغ صحيح', 'error');
                return;
            }
            if (inputVal > state.balance) {
                showToast('رصيدك غير كافٍ!', 'error');
                return;
            }
            if (state.gamePhase !== 'waiting') {
                showToast('الرهان غير متاح الآن', 'error');
                return;
            }

            state.currentBetAmount = roundTon(inputVal);
            state.balance = roundTon(state.balance - state.currentBetAmount);
            state.isBetPlaced = true;
            state.hasCashedOut = false;
            state.currentWinnings = 0;
            updateBalanceUI();
            closeBetModal();
            
            updatePlayersUI('waiting');
            updateButton('cancel');
        }

        function cancelBet() {
            if (state.gamePhase !== 'waiting') {
                showToast('لا يمكن الإلغاء الآن', 'error');
                return;
            }
            
            state.balance = roundTon(state.balance + state.currentBetAmount);
            state.isBetPlaced = false;
            state.currentBetAmount = 0;
            state.currentWinnings = 0;
            updateBalanceUI();
            updatePlayersUI('empty');
            updateButton('place');
        }

        function roundTon(val) {
            return Math.round(val * 1000) / 1000;
        }

        function cashOut() {
            if (!state.isBetPlaced || state.hasCashedOut) return;
            if (state.gamePhase !== 'flying') return;
            
            state.hasCashedOut = true;
            state.cashoutMultiplier = state.currentMultiplier;
            state.currentWinnings = roundTon(state.currentBetAmount * state.cashoutMultiplier);
            state.balance = roundTon(state.balance + state.currentWinnings);
            
            state.isBetPlaced = false;
            state.currentBetAmount = 0;

            updateBalanceUI();
            updatePlayersUI('cashed');
            updateButton('disabled');
            
            showToast(`ربحت ${state.currentWinnings.toFixed(3)} 💎`, 'success');
        }

        function updateButton(type) {
            const btn = document.getElementById('mainBtn');
            btn.className = 'action-btn';
            btn.disabled = false;
            switch(type) {
                case 'place':
                    btn.innerText = 'Place bet';
                    btn.classList.add('place');
                    btn.onclick = openBetModal;
                    break;
                case 'cancel':
                    btn.innerText = 'Cancel Bet';
                    btn.classList.add('cancel-btn');
                    btn.onclick = cancelBet;
                    break;
                case 'cashout':
                    btn.innerText = 'Cash Out';
                    btn.classList.add('cashout');
                    btn.onclick = cashOut;
                    break;
                case 'disabled':
                    btn.innerText = 'انتظر الجولة القادمة...';
                    btn.classList.add('disabled');
                    btn.onclick = null;
                    btn.disabled = true;
                    break;
                case 'crashed':
                    btn.innerText = '💥 انفجر!';
                    btn.classList.add('disabled');
                    btn.onclick = null;
                    btn.disabled = true;
                    break;
            }
        }

        function updatePlayersUI(status) {
            const container = document.getElementById('playersSection');
            container.innerHTML = '';

            if (!state.isBetPlaced && status !== 'cashed' && status !== 'crashed') {
                const noEl = document.createElement('div');
                noEl.className = 'no-players';
                noEl.innerText = 'لا توجد رهانات نشطة في هذه الجولة';
                container.appendChild(noEl);
                return;
            }

            function makePlayerCard(opts) {
                const card = document.createElement('div');
                card.className = 'player-card';
                if (opts.type === 'crashed') {
                    card.style.background = 'rgba(220, 38, 38, 0.2)';
                    card.style.borderColor = 'rgba(220, 38, 38, 0.3)';
                }

                const info = document.createElement('div');
                info.className = 'player-info';

                const img = document.createElement('img');
                img.className = 'avatar';
                img.alt = 'Player';
                img.src = opts.avatar || state.playerAvatar;
                img.onerror = () => { img.src = state.playerAvatar; };

                const meta = document.createElement('div');
                const name = document.createElement('div');
                name.className = 'player-name';
                name.innerText = opts.name || 'Leader';
                const sub = document.createElement('div');
                sub.className = 'player-sub';
                if (opts.type === 'crashed') sub.style.color = '#ef4444';
                sub.innerText = opts.subText || '';

                meta.appendChild(name);
                meta.appendChild(sub);
                info.appendChild(img);
                info.appendChild(meta);

                const right = document.createElement('div');
                right.className = 'player-right';
                if (opts.type === 'crashed') {
                    right.style.background = 'rgba(220, 38, 38, 0.2)';
                    right.style.color = '#ef4444';
                    right.style.borderColor = 'rgba(220, 38, 38, 0.3)';
                }
                right.innerText = opts.rightText || '';

                card.appendChild(info);
                card.appendChild(right);
                return card;
            }

            if (status === 'waiting') {
                container.appendChild(makePlayerCard({
                    avatar: state.playerAvatar,
                    name: 'Leader',
                    subText: `${state.currentBetAmount.toFixed(3)} 💎`,
                    rightText: 'قيد الانتظار...'
                }));
            } else if (status === 'cashed') {
                container.appendChild(makePlayerCard({
                    avatar: state.playerAvatar,
                    name: 'Leader',
                    subText: `${state.currentWinnings.toFixed(3)} 💎 (سحبت عند ${state.cashoutMultiplier.toFixed(2)}x)`,
                    rightText: `+${state.currentWinnings.toFixed(3)} 💰`
                }));
            } else if (status === 'crashed') {
                container.appendChild(makePlayerCard({
                    type: 'crashed',
                    avatar: state.playerAvatar,
                    name: 'Leader',
                    subText: `خسرت ${state.currentBetAmount.toFixed(3)} 💎`,
                    rightText: `-${state.currentBetAmount.toFixed(3)} 💎`
                }));
            }
        }

        function addHistory(multiplier) {
            state.gameHistory.unshift(multiplier);
            if (state.gameHistory.length > 10) state.gameHistory.pop();
            renderHistory();
            saveState();
        }

        function renderHistory() {
            const historyBar = document.getElementById('historyBar');
            historyBar.innerHTML = '';
            state.gameHistory.forEach(mult => {
                const pill = document.createElement('div');
                let colorClass = 'h-green';
                if (mult >= 2.0 && mult < 5.0) colorClass = 'h-purple';
                else if (mult >= 5.0) colorClass = 'h-gold';
                
                pill.className = `hist-pill ${colorClass}`;
                pill.innerText = mult.toFixed(2) + 'x';
                historyBar.appendChild(pill);
            });
        }

        function startNewRound() {
            state.gamePhase = 'flying';
            state.crashPoint = generateCrashPoint();
            state.currentMultiplier = 1.00;
            state.flightTime = 0; // إعادة تعيين وقت الطيران للبدء ببطء
            state.canPlaceBet = false;
            
            const rocket = document.getElementById('rocketEmoji');
            rocket.classList.remove('waiting');
            rocket.classList.add('flying');
            rocket.innerText = '🚀';
            
            const multiplierEl = document.getElementById('multiplierDisplay');
            multiplierEl.className = 'multiplier-text';
            multiplierEl.innerText = state.currentMultiplier.toFixed(2) + 'x';
            
            if (state.isBetPlaced && !state.hasCashedOut) {
                updateButton('cashout');
            } else {
                updateButton('disabled');
            }
        }

        function endRound() {
            state.gamePhase = 'crashed';
            state.canPlaceBet = false;
            
            const rocket = document.getElementById('rocketEmoji');
            rocket.classList.remove('flying');
            rocket.classList.add('exploded');
            rocket.innerText = '💥';
            
            const multiplierEl = document.getElementById('multiplierDisplay');
            multiplierEl.className = 'multiplier-text crashed';
            multiplierEl.innerText = '💥 ' + state.crashPoint.toFixed(2) + 'x';
            
            addHistory(state.crashPoint);
            
            if (state.isBetPlaced && !state.hasCashedOut) {
                updatePlayersUI('crashed');
                updateButton('crashed');
                setTimeout(() => {
                    state.isBetPlaced = false;
                    state.currentBetAmount = 0;
                    state.currentWinnings = 0;
                }, 2000);
            }
            
            setTimeout(() => {
                state.gamePhase = 'waiting';
                state.canPlaceBet = true;
                state.waitRemaining = 9.0;
                const rocket = document.getElementById('rocketEmoji');
                rocket.classList.remove('exploded');
                rocket.classList.add('waiting');
                rocket.innerText = '🚀';
                
                document.getElementById('multiplierDisplay').className = 'multiplier-text';
                document.getElementById('multiplierDisplay').innerText = '1.00x';
                
                if (!state.isBetPlaced) {
                    updateButton('place');
                    updatePlayersUI('empty');
                } else {
                    updateButton('cancel');
                }
            }, 3000);
        }

        function gameLoopTick(now) {
            if (!state.lastTimestamp) state.lastTimestamp = now;
            const dt = (now - state.lastTimestamp) / 1000;
            state.lastTimestamp = now;

            if (state.gamePhase === 'waiting') {
                state.waitRemaining = Math.max(0, state.waitRemaining - dt);
                const secondsLeft = Math.ceil(state.waitRemaining);
                document.getElementById('multiplierDisplay').innerText = `يبدأ خلال ${secondsLeft}s`;
                if (state.waitRemaining <= 0) {
                    startNewRound();
                }
            } else if (state.gamePhase === 'flying') {
                // زيادة وقت الطيران
                state.flightTime += dt;
                
                // معادلة أُسية (Exponential) تجعل البداية بطيئة جداً وتتسارع تدريجياً بمرور الوقت
                // Math.pow(1.15, state.flightTime) تضمن صعوداً تدريجياً سلساً وآمناً
                state.currentMultiplier = 1.00 + (Math.pow(1.35, state.flightTime) - 1) * 0.35;
                
                if (state.currentMultiplier >= state.crashPoint) {
                    state.currentMultiplier = state.crashPoint;
                    endRound();
                    requestAnimationFrame(gameLoopTick);
                    return;
                }
                
                document.getElementById('multiplierDisplay').innerText = state.currentMultiplier.toFixed(2) + 'x';
                
                if (state.isBetPlaced && !state.hasCashedOut) {
                    const autoEnabled = document.getElementById('autoCashoutSwitch').checked;
                    if (autoEnabled) {
                        const target = parseFloat(document.getElementById('autoTargetInput').value);
                        if (!isNaN(target) && state.currentMultiplier >= target) {
                            cashOut();
                        }
                    }
                }
            }

            requestAnimationFrame(gameLoopTick);
        }

        function init() {
            loadState();
            createStars();
            updateBalanceUI();
            renderHistory();
            
            if (state.gameHistory.length === 0) {
                [1.45, 2.30, 1.15, 3.20, 1.80, 2.50, 1.10, 4.50, 1.65, 2.80].forEach(mult => {
                    state.gameHistory.push(mult);
                });
                renderHistory();
            }
            
            state.gamePhase = 'waiting';
            state.waitRemaining = 9.0;

            const overlay = document.getElementById('betModal');
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) closeBetModal();
            });
            document.getElementById('closeModalBtn').addEventListener('click', closeBetModal);
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    const overlay = document.getElementById('betModal');
                    if (overlay.classList.contains('active')) closeBetModal();
                }
            });

            state.lastTimestamp = performance.now();
            requestAnimationFrame(gameLoopTick);
        }

        init();
    </script>
</body>
</html>
